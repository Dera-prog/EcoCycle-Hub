services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecocycle
      POSTGRES_PASSWORD: ecocycle
      POSTGRES_DB: ecocycle
    ports:
      - '5436:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecocycle -d ecocycle']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://ecocycle:ecocycle@db:5432/ecocycle
      JWT_SECRET: local-dev-secret
      CORS_ORIGIN: http://localhost:5173
      PORT: '4000'
    ports:
      - '4001:4000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
