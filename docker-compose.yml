services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecocycle
      POSTGRES_PASSWORD: ecocycle
      POSTGRES_DB: ecocycle
    ports:
      - '5436:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecocycle -d ecocycle']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://ecocycle:ecocycle@db:5432/ecocycle
      JWT_SECRET: local-dev-secret-change-me-32chars
      CORS_ORIGIN: http://localhost:5173
      SEED_DEMO: 'true'
      PORT: '4000'
    ports:
      - '4001:4000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
