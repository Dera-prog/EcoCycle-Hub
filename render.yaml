databases:
  - name: ecocycle-db
    databaseName: ecocycle
    user: ecocycle
    plan: free

services:
  - type: web
    name: ecocycle-api
    runtime: docker
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecocycle-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://ecocycle-hub.vercel.app
      - key: SEED_DEMO
        value: "false"
      - key: PAYMENTS_PROVIDER
        value: none
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_API
        value: https://api.paystack.co
      - key: LOG_LEVEL
        value: info
      - key: SENTRY_DSN
        sync: false
